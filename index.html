<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- import jQuery -->
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
  <script src="index.js"></script>
</head>

<body>
  <div id="stats_header" style="text-align: center; margin-bottom: 20px; font-family: sans-serif;">
    <h2>
      Clicks: <span id="clicks">0</span> | 
      Matched: <span id="matched">0</span> | 
      Left: <span id="left">3</span> | 
      Total Pairs: 3 |
      Time Left: <span id="time">30</span>s
    </h2>
    <div class="d-inline-flex gap-2 align-items-center">
      <div class="btn-group" role="group">
  <button type="button" class="btn btn-primary diff-btn" data-diff="easy">Easy</button>
  <button type="button" class="btn btn-primary diff-btn" data-diff="medium">Medium</button>
  <button type="button" class="btn btn-primary diff-btn" data-diff="hard">Hard</button>
</div>
      <div class="btn-group" role="group">
        <button type="button" id="start_btn" class="btn btn-primary">Start</button>
        <button type="button" id="reset_btn" class="btn btn-primary">Reset</button>
        <button type="button" id="theme_btn" class="btn btn-primary">Toggle Theme</button>
        <button type="button" id="powerup_btn" class="btn btn-primary">Peek!</button>
      </div>
    </div>
  
  <div id="game_grid">
    </div>
</body>

</html>
